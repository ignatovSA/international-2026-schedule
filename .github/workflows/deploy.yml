name: Sync schedule and deploy

# Everything runs on GitHub's servers — nothing here needs your machine to be on.
#
# Sync and deploy are deliberately ONE workflow. Splitting them does not work:
# a commit pushed with the default GITHUB_TOKEN does not trigger further
# workflow runs (GitHub's recursion guard), so a separate push-triggered deploy
# would never fire from the cron and the site would silently go stale.

on:
  schedule:
    # Every 5 minutes — GitHub's shortest allowed interval; anything smaller
    # (*/1, */2) is not honoured. Runs also sit on shared infrastructure and can
    # be delayed by several minutes under load, so treat this as a best effort.
    #
    # One Liquipedia API call per run = 1 per 300s, comfortably inside their
    # limit of at most one action=parse call per 30s.
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to commit a changed schedule
  pages: write
  id-token: write

# Never let two deploys race; let a queued one wait rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # sync.mjs sets changed=true only when the schedule itself moved. It
      # fingerprints the content excluding `updatedAt`, so an unchanged
      # schedule leaves the file byte-identical — nothing to commit, nothing
      # to republish.
      #
      # If Liquipedia is unreachable or changes its layout the script fails
      # without touching the file, so the last good schedule stays published.
      - name: Fetch latest schedule from Liquipedia
        id: sync
        continue-on-error: true
        run: node scripts/sync.mjs --force

      - name: Commit the refreshed schedule
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/schedule.json
          git commit -m "chore: update TI 2026 schedule from Liquipedia"
          git push

      - name: Report
        run: |
          node -e "
            const d = require('./public/data/schedule.json');
            const done = d.matches.filter(m => m.finished).length;
            const tbd = d.matches.filter(m => m.teams.some(t => t.tbd)).length;
            console.log(\`\${d.matchCount} matches · \${done} finished · \${tbd} awaiting opponents\`);
            console.log(\`content \${d.contentHash}, updated \${d.updatedAt}\`);
          "
          echo "schedule changed this run: ${{ steps.sync.outputs.changed || 'unknown (sync failed)' }}"

      # Republishing an identical site 288x a day is pointless, so a scheduled
      # run only deploys when the data actually moved. Pushes and manual runs
      # always deploy, because those change the app itself, not the schedule.
      - uses: actions/configure-pages@v5
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: actions/upload-pages-artifact@v3
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: public

      - id: deployment
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
